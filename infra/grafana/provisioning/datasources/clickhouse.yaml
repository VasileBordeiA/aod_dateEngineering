apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: grafana_ro
      defaultDatabase: taxi
      # seconds; must stay under the grafana profile's max_execution_time constraint (30)
      queryTimeout: "15"
    secureJsonData:
      password: ${CLICKHOUSE_GRAFANA_PASSWORD}
