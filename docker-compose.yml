name: nyctaxi

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports: ["127.0.0.1:19092:19092", "127.0.0.1:9644:9644"]
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1536m
    restart: unless-stopped
    logging: *logging

  redpanda-init:
    image: redpandadata/redpanda:v26.2.3
    depends_on: { redpanda: { condition: service_healthy } }
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      RPK_BROKERS: redpanda:9092
      TOPIC_RETENTION_BYTES: ${TOPIC_RETENTION_BYTES:-1073741824}
    volumes: ["./infra/redpanda:/scripts:ro"]
    restart: "no"
    logging: *logging

  redpanda-console:
    image: redpandadata/console:v3.12.0
    depends_on: { redpanda: { condition: service_healthy } }
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.34
    depends_on: { redpanda-init: { condition: service_completed_successfully } }
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?run make secrets}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_INGEST_PASSWORD: ${CLICKHOUSE_INGEST_PASSWORD:?run make secrets}
      CLICKHOUSE_AGENT_PASSWORD: ${CLICKHOUSE_AGENT_PASSWORD:?run make secrets}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:?run make secrets}
      CLICKHOUSE_OPS_PASSWORD: ${CLICKHOUSE_OPS_PASSWORD:?run make secrets}
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./infra/clickhouse/config.d/stand.xml:/etc/clickhouse-server/config.d/stand.xml:ro
      - ./infra/clickhouse/users.d/stand.xml:/etc/clickhouse-server/users.d/stand.xml:ro
      - ./data/zones.csv:/data/zones.csv:ro
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 4g
    restart: unless-stopped
    logging: *logging

  grafana:
    build: infra/grafana
    depends_on: { clickhouse: { condition: service_healthy } }
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make secrets}
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/nyc-taxi-live.json
      # No internet at the venue: new geomap panels start on the zone outlines, never on a tile server
      GF_GEOMAP_DEFAULT_BASELAYER_CONFIG: >-
        {"type":"geojson","name":"Taxi zones","config":{"src":"public/maps/taxi_zones.geojson","rules":[],
        "style":{"color":{"fixed":"#3a3f4a"},"opacity":0.6,"lineWidth":1}}}
      GF_GEOMAP_ENABLE_CUSTOM_BASELAYERS: "false"
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD}
    ports: ["127.0.0.1:3001:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/taxi_zones.geojson:/usr/share/grafana/public/maps/taxi_zones.geojson:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 384m
    restart: unless-stopped
    logging: *logging

  # Operator-only Stand Health (ADR-017). Grafana OSS lets any viewer query any datasource of its org, so the
  # grafana_ops datasource (agent_log, system.query_log) lives in its own Grafana: localhost only, login required,
  # not behind Caddy.
  grafana-ops:
    build: infra/grafana
    depends_on: { clickhouse: { condition: service_healthy } }
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3002/
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make secrets}
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/stand-health.json
      CLICKHOUSE_OPS_PASSWORD: ${CLICKHOUSE_OPS_PASSWORD}
    ports: ["127.0.0.1:3002:3000"]
    volumes: ["./infra/grafana/provisioning-ops:/etc/grafana/provisioning:ro"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 384m
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      grafana: { condition: service_healthy }
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    ports: ["0.0.0.0:80:80"]
    volumes: ["./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  processor:
    build: services/processor
    env_file: [.env]
    environment:
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      PROCESSOR_STATE_DIR: /state
      PROCESSOR_ZONES_PATH: /data/zones.csv
      TZ: UTC
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
    volumes:
      - processor-state:/state
      - ./data/zones.csv:/data/zones.csv:ro
    healthcheck:
      test: ["CMD", "python", "-m", "processor.health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging

  replayer:
    build: services/replayer
    env_file: [.env]
    environment:
      DATA_DIR: /data
      KAFKA_BROKERS: redpanda:9092
      TZ: UTC
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
      processor: { condition: service_healthy }
    ports: ["127.0.0.1:8001:8001"]
    volumes:
      - ./data/replay:/data/replay:ro
      - replayer-state:/data/state
    healthcheck:
      test: ["CMD", "python", "-m", "replayer.health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  api:
    build: services/api
    env_file: [.env]
    environment:
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      AGENT_GOLDEN_PATH: /app/evals/agent_golden_questions.yaml
      # make eval overrides these from the shell (spec 10). Otherwise they come from .env.
      LLM_ORDER: ${LLM_ORDER}
      LLM_LOCAL_MODEL: ${LLM_LOCAL_MODEL}
      AGENT_MODE: ${AGENT_MODE}
      TZ: UTC
    extra_hosts: ["host.docker.internal:host-gateway"]  # native Ollama on the Mac (spec 09)
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./evals/agent_golden_questions.yaml:/app/evals/agent_golden_questions.yaml:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: web
      args: { NEXT_PUBLIC_GRAFANA_PATH: "${NEXT_PUBLIC_GRAFANA_PATH}" }
    depends_on: { api: { condition: service_healthy } }
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

volumes:
  redpanda-data:
  clickhouse-data:
  processor-state:
  replayer-state:
